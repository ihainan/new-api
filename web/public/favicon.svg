<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!--
    ZGCAI Model Hub 品牌标记：一个中心节点，三条均布的接入线。
    这套网关做的事就是把多个上游模型收敛到一个入口，所以图形画的是「汇聚」，
    不是抽象装饰。构图语法沿用 ZGCAI Coding Plan 的标记（24×24、圆角 7、
    深色底 #14181f、白色图形），两个系统并排时看得出是一家。
    三个卫星点取 120° 均布而非左二右一：后者在 16px 下偏心，读起来像分子式。
    缩到 16px 时卫星会糊成小块，但中心实心圆仍在，整体还认得出是枢纽。
  -->
  <rect width="24" height="24" rx="7" fill="#14181f"/>
  <g stroke="#fff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.78">
    <path d="M12 12 L12 6.6"/>
    <path d="M12 12 L7.3 15.1"/>
    <path d="M12 12 L16.7 15.1"/>
  </g>
  <circle cx="12" cy="6.3" r="1.85" fill="#fff" opacity="0.72"/>
  <circle cx="7.1" cy="15.4" r="1.85" fill="#fff" opacity="0.72"/>
  <circle cx="16.9" cy="15.4" r="1.85" fill="#fff" opacity="0.72"/>
  <circle cx="12" cy="12" r="3.15" fill="#fff"/>
</svg>
